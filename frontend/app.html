<!DOCTYPE html>
<html lang="es-CL">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="GestioApp: inventario multi-sede, gestión de usuarios y auditoría para PyMEs.">
  <meta name="theme-color" content="#111827">
  <title>GestioApp</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23FF6B00'/%3E%3Cpath d='M24 11a9 9 0 1 0 1 6h-8' fill='none' stroke='%23fff' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">

  <!-- Tipografía -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

  <!-- Bootstrap 5 (solo CSS) + Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

  <!-- Estilos propios (después de Bootstrap para poder sobrescribir) -->
  <link href="css/styles.css" rel="stylesheet">
  <!-- Capa de movimiento: parallax, botones y tarjetas interactivas (se apaga sola con "Reducir animaciones") -->
  <link href="css/motion.css" rel="stylesheet">
  <!-- Botones "tecla de equipo": cara con luz, labio inferior y leyenda del ícono (solo estética) -->
  <link href="css/buttons.css" rel="stylesheet">

</head>
<body>
  <!-- Enlace para saltar la navegación (visible al recibir foco con Tab) -->
  <a class="skip-link" href="#main" data-action="skip-to-content">Saltar al contenido principal</a>

  <!-- Aplicación -->
  <div id="app"></div>

  <!-- Modales: fuera de #app para poder marcar el resto como inerte -->
  <div id="modal-root"></div>

  <!-- Notificación visual (los lectores de pantalla usan las regiones de abajo) -->
  <div id="toast" class="toast-g" aria-hidden="true"></div>

  <!-- Regiones de anuncio para lectores de pantalla -->
  <div id="live-polite" class="visually-hidden" aria-live="polite" aria-atomic="true"></div>
  <div id="live-assertive" class="visually-hidden" aria-live="assertive" aria-atomic="true"></div>

  <noscript>
    <p class="noscript-g">GestioApp necesita JavaScript activado para funcionar. Actívelo en la configuración de su navegador y recargue la página.</p>
  </noscript>

  <!-- Orden de carga: configuración → utilidades → servicios → interfaz → módulos → router -->
  <script src="js/backend-config.js"></script>
  <script src="js/config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/validators.js"></script>
  <script src="js/services/http-client.js"></script>
  <script src="js/services/mock-data.js"></script>
  <script src="js/services/mock-adapter.js"></script>
  <script src="js/services/api.js"></script>
  <script src="js/a11y.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/components.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/actions.js"></script>
  <script src="js/assets.js"></script>
  <script src="js/users.js"></script>
  <script src="js/audit-page.js"></script>
  <script src="js/downloads.js"></script>
  <script src="js/settings.js"></script>
  <script src="js/pages.js"></script>
  <script src="js/router.js"></script>
  <script src="js/main.js"></script>
  <script src="js/motion.js"></script>
</body>
</html>
